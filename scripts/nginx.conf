user  nginx;
worker_processes  auto;

error_log   /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
}

http {

  # --- Performance: Gzip Compression ---
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 4;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    image/svg+xml;

  # --- Performance: TCP tuning ---
  tcp_nodelay on;
  tcp_nopush on;
  sendfile on;

  # --- Timeouts ---
  proxy_connect_timeout 60s;
  proxy_send_timeout 600s;
  proxy_read_timeout 600s;

  server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name localhost _;

    # Certificates (default are generated by omgwtfssl)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_session_timeout 5m;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256:kEDH+AESGCM:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:ECDHE-ECDSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-DSS-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-DSS-AES256-SHA:DHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:AES:CAMELLIA:DES-CBC3-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!aECDH:!EDH-DSS-DES-CBC3-SHA:!EDH-RSA-DES-CBC3-SHA:!KRB5-DES-CBC3-SHA';
    ssl_prefer_server_ciphers on;


    client_max_body_size 1024M;

    # Use Docker DNS with short TTL to force re-resolution
    resolver 127.0.0.11 valid=5s;

    location = /auth {
      set $upstream_app http://mercury-app:3000;
      proxy_pass $upstream_app;
    }

    # iOS Device screen WebSocket proxy (Host-native)
    # Supports multiple providers like mercury-ios-provider, mercury-ios-provider-1, ...
    location ~ ^/d/(?<iosprovider>mercury-ios-provider[^/]*)/(?<p>[0-9]+)/ {
        rewrite ^/d/mercury-ios-provider[^/]*/[0-9]+/(.*)$ /$1 break;
        proxy_pass http://host.docker.internal:$p;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Android Device screen WebSocket proxy
    location ~ ^/d/(?<stfprovider>mercury-provider)/(?<port>[0-9]+)/ {
        rewrite ^/d/mercury-provider/[0-9]+/(.*)$ /$1 break;
        proxy_pass http://$stfprovider:$port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # Performance: disable buffering for real-time screen stream
        proxy_buffering off;
        proxy_cache off;

        # Keep WebSocket alive longer
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /auth/ {
      set $upstream_auth http://mercury-auth:3000;
      proxy_pass $upstream_auth;
    }

    location /api/ {
      set $upstream_api http://mercury-api:3000;
      proxy_pass $upstream_api;
    }

    location /s/image/ {
      set $upstream_storage_image http://mercury-storage-plugin-image:3000;
      proxy_pass $upstream_storage_image;
    }

    location /s/apk/ {
      set $upstream_storage_apk http://mercury-storage-plugin-apk:3000;
      proxy_pass $upstream_storage_apk;
    }

    location /s/ {
      client_max_body_size 2048m;
      client_body_buffer_size 128k;
      set $upstream_storage_temp http://mercury-storage-temp:3000;
      proxy_pass $upstream_storage_temp;
    }

    location /socket.io/ {
      set $upstream_websocket http://mercury-websocket:3000;
      proxy_pass $upstream_websocket;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $http_x_real_ip;

      # Keep WebSocket alive longer
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }

    location / {
      set $upstream_app http://mercury-app:3000;
      proxy_pass $upstream_app;
    }
  }
}
