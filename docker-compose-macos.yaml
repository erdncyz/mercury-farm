name: mercury-farm

networks:
    mercury:
        driver: bridge

services:
    nginx:
        image: "nginx:bookworm@sha256:8adbdcb969e2676478ee2c7ad333956f0c8e0e4c5a7463f4611d7a2e7a7ff5dc"
        container_name: mercury-nginx
        volumes:
            - ./scripts/nginx.conf:/etc/nginx/nginx.conf:ro
            - certs:/etc/nginx/ssl:ro
        extra_hosts:
            - "mercury-ios-provider:host-gateway"
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            mercury-app:
                condition: service_started
            mercury-websocket:
                condition: service_started
            mercury-storage-temp:
                condition: service_started
            mercury-storage-plugin-apk:
                condition: service_started
            mercury-storage-plugin-image:
                condition: service_started
            mercury-api:
                condition: service_started
            mercury-auth:
                condition: service_started
            mercury-provider:
                condition: service_started
            mercury-ssl:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            mercury:
    mercury-mongo:
        image: mongo:7.0@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
        hostname: mercury-mongo
        container_name: mercury-mongo
        ports:
            - 27017:27017
        entrypoint: ["mongod", "--replSet", "mercury-rs", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
        deploy:
            resources:
                limits:
                    cpus: '2'
                    memory: 2G
                reservations:
                    cpus: '0.5'
                    memory: 512M
        healthcheck:
            test: echo "rs.status()" | mongosh --port 27017 --quiet
            interval: 5s
            timeout: 30s
            start_period: 0s
            start_interval: 1s
            retries: 30
        networks:
            mercury:
        volumes:
            - mercury-db-volume:/data/db
    mercury-mongosetup:
        image: mongo:7.0@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
        container_name: mercury-mongosetup
        depends_on:
            mercury-mongo:
                condition: service_healthy
        volumes:
            - ./scripts/mongo_setup.sh:/scripts/mongo_setup.sh
        restart: "no"
        entrypoint: ["bash", "/scripts/mongo_setup.sh"]
        networks:
            mercury:
    mercury-migrate:
        build: .
        image: ${MERCURY_IMAGE:-ghcr.io/erdncyz/mercury-farm:latest}
        container_name: mercury-migrate
        env_file:
            - scripts/variables.env
        command: mercury migrate
        depends_on:
            mercury-mongosetup:
                condition: service_completed_successfully
        networks:
            mercury:
    mercury-app:
        build: .
        image: ${MERCURY_IMAGE:-ghcr.io/erdncyz/mercury-farm:latest}
        container_name: mercury-app
        env_file:
            - scripts/variables.env
        command: mercury app --port 3000 --auth-url https://${MERCURY_DOMAIN}:${MERCURY_PORT}/${AUTH_URL} --websocket-url https://${MERCURY_DOMAIN}:${MERCURY_PORT}/ --secret=${MERCURY_SECRET}
        depends_on:
            mercury-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            mercury:
    mercury-auth:
        build: .
        image: ${MERCURY_IMAGE:-ghcr.io/erdncyz/mercury-farm:latest}
        container_name: mercury-auth
        env_file:
            - scripts/variables.env
        command: mercury auth-mock --port 3000 --app-url https://${MERCURY_DOMAIN}:${MERCURY_PORT} --secret=${MERCURY_SECRET}
        depends_on:
            mercury-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            mercury:
    mercury-processor:
        build: .
        image: ${MERCURY_IMAGE:-ghcr.io/erdncyz/mercury-farm:latest}
        container_name: mercury-processor
        env_file:
            - scripts/variables.env
        command: mercury processor --name processor --connect-app-dealer tcp://mercury-triproxy-app:7160 --connect-dev-dealer tcp://mercury-triproxy-dev:7260
        depends_on:
            mercury-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            mercury:
    mercury-reaper:
        build: .
        image: ${MERCURY_IMAGE:-ghcr.io/erdncyz/mercury-farm:latest}
        container_name: mercury-reaper
        env_file:
            - scripts/variables.env
        command: mercury reaper --name reaper001 --connect-push tcp://mercury-triproxy-dev:7270 --connect-sub tcp://mercury-triproxy-dev:7250 --heartbeat-timeout 30000 --time-to-device-cleanup 10
        depends_on:
            mercury-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            mercury:
    mercury-storage-plugin-apk:
        build: .
        image: ${MERCURY_IMAGE:-ghcr.io/erdncyz/mercury-farm:latest}
        container_name: mercury-storage-plugin-apk
        env_file:
            - scripts/variables.env
        command: mercury storage-plugin-apk --port 3000 --storage-url http://mercury-storage-temp:3000/ --secret=${MERCURY_SECRET}
        depends_on:
            mercury-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            mercury:
    mercury-storage-plugin-image:
        build: .
        image: ${MERCURY_IMAGE:-ghcr.io/erdncyz/mercury-farm:latest}
        container_name: mercury-storage-plugin-image
        env_file:
            - scripts/variables.env
        command: mercury storage-plugin-image --port 3000 --storage-url http://mercury-storage-temp:3000/ --secret=${MERCURY_SECRET}
        depends_on:
            mercury-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            mercury:
    mercury-storage-temp:
        build: .
        image: ${MERCURY_IMAGE:-ghcr.io/erdncyz/mercury-farm:latest}
        container_name: mercury-storage-temp
        ports:
            - "127.0.0.1:7100:3000"
        env_file:
            - scripts/variables.env
        command: mercury storage-temp --port 3000 --save-dir /tmp --connect-sub tcp://mercury-triproxy-app:7150 --connect-push tcp://mercury-triproxy-app:7170 --secret=${MERCURY_SECRET}
        depends_on:
            mercury-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            mercury:
    mercury-triproxy-app:
        build: .
        image: ${MERCURY_IMAGE:-ghcr.io/erdncyz/mercury-farm:latest}
        container_name: mercury-triproxy-app
        env_file:
            - scripts/variables.env
        command: mercury triproxy app001 --bind-pub "tcp://*:7150" --bind-dealer "tcp://*:7160" --bind-pull "tcp://*:7170"
        ports:
            - "7150:7150"
            - "7160:7160"
            - "7170:7170"
        depends_on:
            mercury-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            mercury:
    mercury-triproxy-dev:
        build: .
        image: ${MERCURY_IMAGE:-ghcr.io/erdncyz/mercury-farm:latest}
        container_name: mercury-triproxy-dev
        env_file:
            - scripts/variables.env
        command: mercury triproxy --name dev001 --bind-pub "tcp://*:7250" --bind-dealer "tcp://*:7260" --bind-pull "tcp://*:7270"
        ports:
            - "7250:7250"
            - "7260:7260"
            - "7270:7270"
        depends_on:
            mercury-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            mercury:
    mercury-websocket:
        build: .
        image: ${MERCURY_IMAGE:-ghcr.io/erdncyz/mercury-farm:latest}
        container_name: mercury-websocket
        env_file:
            - scripts/variables.env
        command: mercury websocket --port 3000 --storage-url http://mercury-storage-temp:3000/ --connect-sub tcp://mercury-triproxy-app:7150 --connect-push tcp://mercury-triproxy-app:7170 --connect-sub-dev tcp://mercury-triproxy-dev:7250 --connect-push-dev tcp://mercury-triproxy-dev:7270 --secret=${MERCURY_SECRET}
        deploy:
            resources:
                limits:
                    cpus: '2'
                    memory: 2G
                reservations:
                    cpus: '0.5'
                    memory: 256M
        depends_on:
            mercury-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            mercury:
    mercury-api:
        build: .
        image: ${MERCURY_IMAGE:-ghcr.io/erdncyz/mercury-farm:latest}
        container_name: mercury-api
        env_file:
            - scripts/variables.env
        command: mercury api --port 3000 --connect-sub tcp://mercury-triproxy-app:7150 --connect-push tcp://mercury-triproxy-app:7170 --connect-sub-dev tcp://mercury-triproxy-dev:7250 --connect-push-dev tcp://mercury-triproxy-dev:7270 --secret=${MERCURY_SECRET}
        depends_on:
            mercury-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            mercury:
    mercury-api-groups-engine:
        build: .
        image: ${MERCURY_IMAGE:-ghcr.io/erdncyz/mercury-farm:latest}
        container_name: mercury-api-groups-engine
        env_file:
            - scripts/variables.env
        command: mercury groups-engine --connect-push tcp://mercury-triproxy-app:7170 --connect-push-dev tcp://mercury-triproxy-dev:7270
        depends_on:
            mercury-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            mercury:
    mercury-provider:
        build: .
        image: ${MERCURY_IMAGE:-ghcr.io/erdncyz/mercury-farm:latest}
        container_name: mercury-provider
        env_file:
            - scripts/variables.env
        environment:
            # Device workers occasionally invoke the adb CLI while recovering
            # the STF agent. Keep those calls on the host USB ADB server rather
            # than starting an empty server inside the container.
            ADB_SERVER_SOCKET: tcp:host.docker.internal:5037
        ports:
            - "12010-12100:12010-12100"
            - "13000-13100:13000-13100/udp"
        depends_on:
            mercury-migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        command: mercury provider --name mercury-provider --adb-host host.docker.internal --no-cleanup --connect-sub tcp://mercury-triproxy-dev:7250 --connect-push tcp://mercury-triproxy-dev:7270 --storage-url http://mercury-storage-plugin-apk:3000/ --public-ip ${MERCURY_DOMAIN} --min-port=12010 --max-port=12100 --heartbeat-interval 10000 --screen-ws-url-pattern "wss://${MERCURY_DOMAIN}:${MERCURY_PORT}/d/mercury-provider/<%= publicPort %>/" --screen-frame-rate ${SCREEN_FRAME_RATE:-15} --screen-jpeg-quality ${SCREEN_JPEG_QUALITY:-25} --secret=${MERCURY_SECRET}
        deploy:
            resources:
                limits:
                    cpus: '4'
                    memory: 4G
                reservations:
                    cpus: '1'
                    memory: 512M
        networks:
            mercury:
    mercury-ssl:
        image: "nginx:bookworm@sha256:8adbdcb969e2676478ee2c7ad333956f0c8e0e4c5a7463f4611d7a2e7a7ff5dc"
        environment:
            - SSL_SUBJECT=${MERCURY_DOMAIN}
        volumes:
            - certs:/certs:rw
            - ./scripts/generate-ssl.sh:/scripts/generate-ssl.sh:ro
        entrypoint: ["/bin/sh", "/scripts/generate-ssl.sh"]
volumes:
    mercury-db-volume:
    certs:
