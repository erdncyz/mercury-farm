version: 2
registries:
  github-private-submodules:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.DEPENDABOT_GITHUB_TOKEN}}

updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    registries:
      - github-private-submodules
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "submodule"
    commit-message:
      prefix: "chore(deps)"
