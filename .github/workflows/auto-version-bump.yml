name: Auto Version Bump

on:
  push:
    branches:
      - main

concurrency:
  group: mercury-version-bump
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  bump:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Determine bump level from commit messages
        id: bump
        env:
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail

          messages=$(jq -r '.commits[]?.message // empty' "$GITHUB_EVENT_PATH")
          if [[ -z "$messages" ]]; then
            messages="$HEAD_COMMIT_MSG"
          fi

          bump="patch"
          if grep -Eq 'BREAKING CHANGE|^[a-zA-Z]+(\([^)]+\))?!:' <<< "$messages"; then
            bump="major"
          elif grep -Eq '^feat(\([^)]+\))?:' <<< "$messages"; then
            bump="minor"
          fi

          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Bump package version and open release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          npm version "${{ steps.bump.outputs.bump }}" --no-git-tag-version
          version=$(node -p "require('./package.json').version")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="chore/release-v${version}"

          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists; skipping push."
          else
            git checkout -b "$branch"
            git add package.json package-lock.json

            if git diff --cached --quiet; then
              echo "No package version changes detected."
              exit 0
            fi

            git commit -m "chore(release): v${version}"
            git push origin "$branch"
          fi

          # Create PR only if one does not already exist for this branch.
          existing_pr=$(gh pr list --head "$branch" --base main \
            --json number --jq '.[0].number // empty')
          if [[ -n "$existing_pr" ]]; then
            echo "PR #${existing_pr} already exists for $branch."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(release): v${version}" \
              --body "Automated version bump to \`v${version}\`."
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge on release PR
        if: steps.pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Squash merge keeps the title as commit message ("chore(release): vX.Y.Z")
          # which triggers the release workflow after CI passes.
          gh pr merge "${{ steps.pr.outputs.branch }}" \
            --auto --squash --delete-branch
